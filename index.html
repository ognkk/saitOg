ackground:rgba(255,255,255,.15);box-shadow:0 0 15px rgba(255,255,255,.6);}.time-container{position:fixed;top:var(--time-top);left:50%;transform:translateX(-50%);margin-left:var(--time-left-shift);z-index:10;opacity:0;animation:fadeUp 1s forwards 1.5s;background:rgba(255,255,255,0.05);padding:6px 18px;border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);}.time{font-size:15px;font-weight:500;letter-spacing:1px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.5);}.song-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.4);padding:8px 16px;border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);z-index:10;}.equalizer{display:flex;align-items:flex-end;gap:3px;height:14px;}.equalizer span{display:block;width:3px;background:#fff;border-radius:1px;animation:bounce 1.2s infinite ease-in-out;}.equalizer span:nth-child(1){animation-delay:0s;height:8px;}.equalizer span:nth-child(2){animation-delay:0.2s;height:14px;}.equalizer span:nth-child(3){animation-delay:0.4s;height:6px;}@keyframes bounce{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}.song-title{font-size:16px;font-style:italic;font-weight:400;color:#fff;white-space:nowrap;border-right:2px solid #fff;overflow:hidden;width:0;}#run-img{position:absolute;width:50px;height:50px;cursor:pointer;z-index:5;}</style></head><body><video autoplay muted loop playsinline id="bg-video"><source src="videos/background.mp4" type="video/mp4"></video><div class="overlay"></div><div class="profile"><img src="images/avatar.png" alt="Аватар" class="avatar"><span class="rainbow-nick">OGONEKK101</span></div><div class="container"><a href="https://twitch.tv/ogonekk101" target="_blank" class="icon-link"><img src="images/twitch.png" alt="Twitch"></a><a href="https://t.me/ognklol" target="_blank" class="icon-link"><img src="images/telegram.png" alt="Telegram"></a><a href="https://steamcommunity.com/profiles/76561199438062572/" target="_blank" class="icon-link"><img src="images/steam.png" alt="Steam"></a><a href="https://discordapp.com/users/867120739252961290" target="_blank" class="icon-link"><img src="images/discord.png" alt="Discord"></a><a href="https://www.donationalerts.com/r/ogonekk101" target="_blank" class="icon-link"><img src="images/donationalerts.png" alt="DonationAlerts"></a></div><div class="time-container"><div class="time" id="time">00:00:00</div></div><div class="song-container"><div class="equalizer"><span></span><span></span><span></span></div><div class="song-title" id="song-title"></div></div><audio id="bg-music"></audio><img src="images/run.png" id="run-img" alt="run"><script>function updateTime(){const e=new Date,t=e.getUTCHours()+3;let o=t>=24?t-24:t,a=e.getUTCMinutes(),n=e.getUTCSeconds(),r=o<10?"0"+o:o,i=a<10?"0"+a:a,s=n<10?"0"+n:n;document.getElementById("time").textContent=`${r}:${i}:${s}`;}setInterval(updateTime,1e3);updateTime();window.addEventListener('DOMContentLoaded',()=>{const e=document.getElementById('run-img'),t=document.getElementById('bg-music'),o=document.getElementById('song-title'),a=document.getElementById('bg-video');const maxVolume=0.03;t.volume=0;const playlist=[{src:'music/song.mp3',title:'Empire Of The Sun - Walking On A Dream ッ'},{src:'music/song2.mp3',title:'Outkast - Ms. Jackson  ッ'},{src:'music/song3.mp3',title:'Eem Triplin - If I Wanted To ッ'},{src:'music/song4.mp3',title:'Eryn Martin, Guapdad 4000 - Ball ッ'},{src:'music/song5.mp3',title:'Outkast - Hey Ya! (Radio Mix-Club Mix) ッ'}];let currentTrackIndex=Math.floor(Math.random()*playlist.length);let currentTitle="";function fadeIn(){let vol=0;t.volume=0;const fadeInterval=setInterval(()=>{vol+=0.003;if(vol>=maxVolume){t.volume=maxVolume;clearInterval(fadeInterval);}else{t.volume=vol;}},100);}function fadeOut(callback){let vol=t.volume;const fadeInterval=setInterval(()=>{vol-=0.003;if(vol<=0){t.volume=0;clearInterval(fadeInterval);if(callback)callback();}else{t.volume=vol;}},100);}function loadTrack(index,autoPlay=false){t.src=playlist[index].src;currentTitle="Now Playing: "+playlist[index].title;o.textContent=currentTitle;if(autoPlay){t.play().then(()=>{fadeIn();}).catch(err=>console.log("Ошибка автовоспроизведения трека:",err));}}loadTrack(currentTrackIndex,false);t.addEventListener('ended',()=>{fadeOut(()=>{currentTrackIndex=(currentTrackIndex+1)%playlist.length;loadTrack(currentTrackIndex,true);});});!function runTypewriter(){o.style.width='0';let r=0;const i=150;!function typeStep(){if(r<=currentTitle.length){o.style.width=(r+1)+'ch';r++;setTimeout(typeStep,i);}else{setTimeout(()=>{r=0;o.style.width='0';setTimeout(typeStep,i);},2e3);}}();}();setInterval(()=>{o.style.borderRightColor="#"===o.style.borderRightColor?"#fff":"transparent";},500);document.body.addEventListener('click',()=>{if(t.paused){t.play().then(()=>{fadeIn();}).catch(err=>console.log("Ожидание клика для музыки"));}a.play().catch(()=>console.log("Видео не запустилось автоматически"));},{once:!0});function teleportImage(){const imgWidth=e.offsetWidth||50;const imgHeight=e.offsetHeight||50;const maxX=window.innerWidth-imgWidth;const maxY=window.innerHeight-imgHeight;const randomX=Math.floor(Math.random()*Math.max(0,maxX));const randomY=Math.floor(Math.random()*Math.max(0,maxY));e.style.left=randomX+'px';e.style.top=randomY+'px';}teleportImage();e.addEventListener('mouseenter',teleportImage);});</script></body></html>
