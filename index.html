<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGONEKK💦</title>
    <link rel="icon" type="image/png" href="images/favicon2.png">
    <style>
        :root { 
            --profile-top: 360px; 
            --profile-left-shift: -60px; 
            --icons-top: 530px; 
            --icons-left-shift: -180px; 
            --time-top: 610px; 
            --time-left-shift: -25px; 
        } 
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            color: #fff; 
            cursor: url('images/cursor.png'), auto; 
        } 
        #bg-video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: -2; 
        } 
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,.3); 
            z-index: -1; 
        } 
        @keyframes fadeUp { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        } 
        .profile { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: fixed; 
            top: var(--profile-top); 
            left: 50%; 
            transform: translateX(-50%); 
            margin-left: var(--profile-left-shift); 
            gap: 11px; 
            z-index: 1; 
            opacity: 0; 
            animation: fadeUp 1s forwards; 
        } 
        .avatar { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            border: 3px solid #fff; 
            object-fit: cover; 
        } 
        .rainbow-nick { 
            font-size: 19px; 
            font-weight: 400; 
            color: #fff; 
            opacity: 0; 
            animation: fadeUp 1s forwards .5s; 
        } 
        .container { 
            display: flex; 
            flex-direction: row; 
            gap: 20px; 
            justify-content: center; 
            align-items: center; 
            position: fixed; 
            top: var(--icons-top); 
            left: 50%; 
            transform: translateX(-50%); 
            margin-left: var(--icons-left-shift); 
            z-index: 1; 
            opacity: 0; 
            animation: fadeUp 1s forwards 1s; 
        } 
        .icon-link { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: rgba(255,255,255,.1); 
            transition: transform .3s, box-shadow .3s; 
        } 
        .icon-link img { 
            width: 70%; 
            height: 70%; 
            object-fit: contain; 
        } 
        .icon-link:hover { 
            transform: scale(1.1); 
            box-shadow: 0 0 15px rgba(255,255,255,.7); 
        } 
        .time { 
            position: fixed; 
            top: var(--time-top); 
            left: 50%; 
            transform: translateX(-50%); 
            margin-left: var(--time-left-shift); 
            font-size: 16px; 
            font-weight: 400; 
            color: #fff; 
            z-index: 10; 
            opacity: 0; 
            animation: fadeUp 1s forwards 1.5s; 
        } 
        .song-title { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 18px; 
            font-style: italic; 
            font-weight: 400; 
            color: #fff; 
            white-space: nowrap; 
            border-right: 2px solid #fff; 
            overflow: hidden; 
            width: 0; 
        } 
        /* Стили для убегающей картинки вынесены сюда для надежности */
        #run-img { 
            position: absolute; 
            width: 50px; 
            height: 50px; 
            cursor: pointer; 
            z-index: 5; 
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="videos/background.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    
    <div class="profile">
        <img src="images/avatar.png" alt="Аватар" class="avatar">
        <span class="rainbow-nick">OGONEKK101</span>
    </div>
    
    <div class="container">
        <a href="https://twitch.tv/ogonekk101" target="_blank" class="icon-link"><img src="images/twitch.png" alt="Twitch"></a>
        <a href="https://t.me/ognklol" target="_blank" class="icon-link"><img src="images/telegram.png" alt="Telegram"></a>
        <a href="https://steamcommunity.com/profiles/76561199438062572/" target="_blank" class="icon-link"><img src="images/steam.png" alt="Steam"></a>
        <a href="https://discordapp.com/users/867120739252961290" target="_blank" class="icon-link"><img src="images/discord.png" alt="Discord"></a>
        <a href="https://www.donationalerts.com/r/ogonekk101" target="_blank" class="icon-link"><img src="images/donationalerts.png" alt="DonationAlerts"></a>
    </div>
    
    <div class="time" id="time">00:00:00</div>
    <div class="song-title" id="song-title"></div>
    <audio id="bg-music"></audio>
    
    <!-- Картинка без лишних громоздких инлайн-стилей -->
    <img src="images/run.png" id="run-img" alt="run">

    <script>
        function updateTime() {
            const e = new Date, t = e.getUTCHours() + 3; 
            let o = t >= 24 ? t - 24 : t, 
                a = e.getUTCMinutes(), 
                n = e.getUTCSeconds(), 
                r = o < 10 ? "0" + o : o, 
                i = a < 10 ? "0" + a : a, 
                s = n < 10 ? "0" + n : n; 
            document.getElementById("time").textContent = `${r}:${i}:${s}`;
        } 
        setInterval(updateTime, 1e3); 
        updateTime(); 

        window.addEventListener('DOMContentLoaded', () => {
            const e = document.getElementById('run-img'), 
                  t = document.getElementById('bg-music'), 
                  o = document.getElementById('song-title'), 
                  a = document.getElementById('bg-video'); 
            
            t.volume = 0.03; 
            
            const playlist = [
                { src: 'music/song.mp3', title: 'Gideon Rises - End Credits ッ' }, 
                { src: 'music/song2.mp3', title: 'Infrunami - Steve Lacy  ッ' }, 
                { src: 'music/song3.mp3', title: 'Куда - MAYOT ッ' }, 
                { src: 'music/song4.mp3', title: 'Outside - Calvin Harries ッ' }, 
                { src: 'music/song5.mp3', title: 'DO IT AGAIN - Ellisar ッ' }, 
                { src: 'music/song6.mp3', title: 'Outside - Calvin Harries ッ' }, 
                { src: 'music/song7.mp3', title: 'Crazy - Gnarls Barkley ッ' }
            ]; 

            let currentTrackIndex = Math.floor(Math.random() * playlist.length); 
            let currentTitle = ""; 

            function loadTrack(index) {
                t.src = playlist[index].src; 
                currentTitle = "Now Playing: " + playlist[index].title; 
                o.textContent = currentTitle;
            } 
            
            loadTrack(currentTrackIndex); 

            t.addEventListener('ended', () => {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length; 
                loadTrack(currentTrackIndex); 
                t.play().catch(err => console.log("Ошибка автовоспроизведения трека:", err));
            }); 

            // Анимация печатной машинки
            !function runTypewriter() {
                o.style.width = '0'; 
                let r = 0; 
                const i = 150; 
                !function typeStep() {
                    if (r <= currentTitle.length) {
                        o.style.width = (r + 1) + 'ch'; 
                        r++; 
                        setTimeout(typeStep, i);
                    } else {
                        setTimeout(() => {
                            r = 0; 
                            o.style.width = '0'; 
                            setTimeout(typeStep, i);
                        }, 2e3);
                    }
                }();
            }();

            setInterval(() => {
                o.style.borderRightColor = "#" === o.style.borderRightColor ? "#fff" : "transparent";
            }, 500); 

            // Разрешение автозапроса медиа по клику
            document.body.addEventListener('click', () => {
                t.play().catch(err => console.log("Ожидание клика для музыки")); 
                a.play().catch(() => console.log("Видео не запустилось автоматически"));
            }, { once: !0 }); 

            // Функция телепортации картинки (теперь с защитой от пустых размеров)
            function teleportImage() {
                const imgWidth = e.offsetWidth || 50; 
                const imgHeight = e.offsetHeight || 50; 
                const maxX = window.innerWidth - imgWidth; 
                const maxY = window.innerHeight - imgHeight; 
                const randomX = Math.floor(Math.random() * Math.max(0, maxX)); 
                const randomY = Math.floor(Math.random() * Math.max(0, maxY)); 
                e.style.left = randomX + 'px'; 
                e.style.top = randomY + 'px';
            } 

            // Вызываем телепорт сразу после загрузки DOM и при наведении
            teleportImage();
            e.addEventListener('mouseenter', teleportImage);
        });
    </script>
</body>
</html>
